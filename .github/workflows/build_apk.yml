name: Build Operit Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create local.properties & Stubs
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/libs
          if [ ! -f "app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so" ]; then
            touch app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x verifyExternallyBuiltNativeLibraries --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Operit-AI-VideoCall-Debug
          path: app/build/outputs/apk/debug/*.apk